# FFAS 산불통계 XHR → forestfire_stats 전량교체 (내용 동일 시 skip)
# 실패 시 gh workflow run 으로 새 runner 재시도 (최대 3회)
name: forestfire-stats-ffas

on:
  schedule:
    # 19:00 UTC = 04:00 KST (날씨 03:00 이후)
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 DB 적재 생략"
        required: false
        default: "false"
      force:
        description: "true면 동일 내용이어도 전량교체"
        required: false
        default: "false"
      retry:
        description: "재시도 횟수 (자동 트리거용, 수동 실행 시 0)"
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forestfire-stats

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forestfire-stats/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL
        env:
          TZ: Asia/Seoul
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          # DB2_HOST: ${{ secrets.DB2_HOST }}
          # DB2_PORT: ${{ secrets.DB2_PORT }}
          # DB2_USER: ${{ secrets.DB2_USER }}
          # DB2_PASSWORD: ${{ secrets.DB2_PASSWORD }}
          # DB2_NAME: ${{ secrets.DB2_NAME }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          FORCE="${{ github.event.inputs.force }}"
          ARGS=(--no-save)
          if [ "$DRY" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          python update_forestfire_stats_ffas.py "${ARGS[@]}"

      - name: Retry workflow on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETRY: ${{ github.event.inputs.retry || '0' }}
          MAX_RETRY: "3"
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          n=$((RETRY + 1))
          if [ "$n" -gt "$MAX_RETRY" ]; then
            echo "retry limit reached ($RETRY/$MAX_RETRY) — stop"
            exit 0
          fi
          echo "ETL failed; re-triggering workflow with retry=$n"
          gh workflow run forestfire-stats_ffas.yml \
            --ref "${{ github.ref_name }}" \
            -f dry_run="$DRY" \
            -f force="$FORCE" \
            -f retry="$n"
